name: TradeLedger

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "e2e/**"
      - "scripts/**"
      - "docs/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "*.ts"
      - "*.json"
      - ".github/workflows/trade-ledger.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "e2e/**"
      - "scripts/**"
      - "docs/**"
      - "Dockerfile"
      - "compose.yaml"
      - ".dockerignore"
      - ".env.example"
      - "README.md"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "*.ts"
      - "*.json"
      - ".github/workflows/trade-ledger.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check:all

      - name: Unit and integration tests
        run: npm test

      - name: Build server and frontend
        run: npm run build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Browser acceptance
        run: npm run test:e2e

      - name: Docker smoke
        run: npm run test:docker
